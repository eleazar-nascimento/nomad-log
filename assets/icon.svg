<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="50%" stop-color="#141A29"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FF6838" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Compass Needle Gradients -->
    <linearGradient id="northNeedle" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#E03E15"/>
      <stop offset="50%" stop-color="#FF6838"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>

    <linearGradient id="northNeedleRight" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#C22E08"/>
      <stop offset="60%" stop-color="#E54B1F"/>
      <stop offset="100%" stop-color="#FF7A50"/>
    </linearGradient>

    <linearGradient id="southNeedle" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <linearGradient id="southNeedleRight" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Ring Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6838" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="mountainGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="mountainRidge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="needleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF6838" flood-opacity="0.45"/>
    </filter>

    <filter id="centerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FFFFFF" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Squircle Shape (iOS 1024x1024 specification rx="225") -->
  <rect width="1024" height="1024" rx="225" fill="url(#bgGradient)"/>

  <!-- Subtle Top Edge Light Inner Stroke -->
  <rect x="4" y="4" width="1016" height="1016" rx="222" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="512" cy="480" r="380" fill="url(#ambientGlow)"/>

  <!-- Coordinate Orbit & Topographic Grid Rings (Offline Exploration Motif) -->
  <g opacity="0.25">
    <circle cx="512" cy="512" r="390" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 8"/>
    <ellipse cx="512" cy="512" rx="360" ry="140" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 6" transform="rotate(-22 512 512)"/>
    <ellipse cx="512" cy="512" rx="360" ry="140" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 6" transform="rotate(22 512 512)"/>
  </g>

  <!-- Outer Dial Compass Ring -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.85"/>
  <circle cx="512" cy="512" r="306" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Compass Cardinal Dial Ticks -->
  <g stroke="#F8FAFC" stroke-linecap="round" opacity="0.8">
    <!-- North Marker Tick -->
    <line x1="512" y1="184" x2="512" y2="204" stroke-width="6" stroke="#FF6838"/>
    <!-- South Marker Tick -->
    <line x1="512" y1="820" x2="512" y2="840" stroke-width="6" stroke="#F59E0B"/>
    <!-- East Marker Tick -->
    <line x1="820" y1="512" x2="840" y2="512" stroke-width="6"/>
    <!-- West Marker Tick -->
    <line x1="184" y1="512" x2="204" y2="512" stroke-width="6"/>

    <!-- Intermediate Ticks -->
    <g opacity="0.4" stroke-width="3">
      <line x1="728" y1="296" x2="742" y2="282"/>
      <line x1="296" y1="728" x2="282" y2="742"/>
      <line x1="728" y1="728" x2="742" y2="742"/>
      <line x1="296" y1="296" x2="282" y2="282"/>
    </g>
  </g>

  <!-- Mountain Peaks (Off-Grid Treks & Trails Background Motif) -->
  <g opacity="0.9">
    <!-- Secondary Peak Right -->
    <path d="M510 590 L670 410 L810 590 Z" fill="#131B2E" stroke="#1E293B" stroke-width="3"/>
    <path d="M670 410 L670 590" stroke="rgba(56, 189, 248, 0.3)" stroke-width="3"/>

    <!-- Secondary Peak Left -->
    <path d="M214 590 L350 440 L490 590 Z" fill="#131B2E" stroke="#1E293B" stroke-width="3"/>
    <path d="M350 440 L350 590" stroke="rgba(245, 158, 11, 0.3)" stroke-width="3"/>

    <!-- Main Central Mountain Peak -->
    <polygon points="512,320 690,610 334,610" fill="url(#mountainGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <!-- Mountain Ridge Highlight -->
    <path d="M512 320 Q500 460 460 610" stroke="url(#mountainRidge)" stroke-width="4" fill="none"/>
  </g>

  <!-- Horizon Ground Line with Offline Mesh Lines -->
  <path d="M250 610 L774 610" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <path d="M290 630 L734 630" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.5"/>

  <!-- Compass Star Needle (The Primary Icon Hero) -->
  <g filter="url(#needleGlow)">
    <!-- NORTH NEEDLE (Vibrant Sunset Orange) -->
    <!-- Left Half (Lighted Face) -->
    <polygon points="512,170 512,512 432,512" fill="url(#northNeedle)"/>
    <!-- Right Half (Shaded Face) -->
    <polygon points="512,170 512,512 592,512" fill="url(#northNeedleRight)"/>

    <!-- SOUTH NEEDLE (Warm Amber Gold) -->
    <!-- Left Half (Shaded Face) -->
    <polygon points="512,854 512,512 432,512" fill="url(#southNeedle)"/>
    <!-- Right Half (Lighted Face) -->
    <polygon points="512,854 512,512 592,512" fill="url(#southNeedleRight)"/>

    <!-- EAST NEEDLE WING -->
    <polygon points="854,512 512,512 512,472" fill="#E2E8F0" opacity="0.9"/>
    <polygon points="854,512 512,512 512,552" fill="#94A3B8" opacity="0.9"/>

    <!-- WEST NEEDLE WING -->
    <polygon points="170,512 512,512 512,472" fill="#CBD5E1" opacity="0.9"/>
    <polygon points="170,512 512,512 512,552" fill="#64748B" opacity="0.9"/>
  </g>

  <!-- Center Pin & Gem Pivot -->
  <circle cx="512" cy="512" r="38" fill="#0B0F19" stroke="#FF6838" stroke-width="4"/>
  <circle cx="512" cy="512" r="24" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="512" cy="512" r="12" fill="#FFFFFF" filter="url(#centerGlow)"/>

  <!-- Subtle Glowing North Star Dot -->
  <circle cx="512" cy="144" r="8" fill="#FF8C66" filter="url(#centerGlow)"/>
</svg>

